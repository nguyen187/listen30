<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Talk Shop</title>
<meta name="description" content="Luyện nói tiếng Anh cho công việc ngành hàng không: câu mẫu, nhập vai cuộc họp, trình bày, phát âm. Có thu âm và chấm bằng nhận dạng giọng nói.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a cockpit-style "annunciator" strip of 30 days on top, then a single working column; the record button is the instrument everything revolves around. */
:root{
  --bg:#eef1f0; --surface:#ffffff; --sunken:#e1e6e4; --ink:#13201d; --muted:#55645e; --line:#cdd6d2;
  --accent:#9a4f00; --accent-ink:#ffffff; --accent-soft:#fbe7cb;
  --good:#0f6e48; --good-soft:#d8f1e4; --bad:#a8322a; --bad-soft:#f9dfdb; --rec:#d6312b;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px; color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1513; --surface:#16201d; --sunken:#1d2a26; --ink:#e4ece9; --muted:#93a39d; --line:#2a3833;
  --accent:#ffb43a; --accent-ink:#1a1206; --accent-soft:#3a2a10;
  --good:#4bd18f; --good-soft:#123426; --bad:#ff7d70; --bad-soft:#3f1a16; --rec:#ff5a4f; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#16201d; --sunken:#1d2a26; --ink:#e4ece9; --muted:#93a39d; --line:#2a3833;
  --accent:#ffb43a; --accent-ink:#1a1206; --accent-soft:#3a2a10;
  --good:#4bd18f; --good-soft:#123426; --bad:#ff7d70; --bad-soft:#3f1a16; --rec:#ff5a4f; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1;letter-spacing:.01em}
h1{font-size:34px;font-weight:700;text-transform:uppercase}
h2{font-size:28px;font-weight:700}
h3{font-size:21px;font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.brand{display:flex;align-items:center;gap:12px}
.lamp{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--sunken);padding:4px;border-radius:8px}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.strip{margin-top:16px;display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:3px}
.strip button{border:0;height:30px;border-radius:3px;background:var(--sunken);cursor:pointer;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.strip button.done{background:var(--accent);color:var(--accent-ink)}
.strip button.part{background:var(--accent-soft);color:var(--ink)}
.strip button.cur{outline:2px solid var(--ink);outline-offset:1px}
@media (max-width:620px){.strip{grid-template-columns:repeat(15,minmax(0,1fr))}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.play::before{content:"";width:0;height:0;border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunken);color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,28px));gap:5px;align-items:center;justify-items:center} .cal i,.panel .row i[class^=cal-]{display:inline-block;width:22px;height:22px;border-radius:5px;vertical-align:middle} .row.small i[class^=cal-]{width:12px;height:12px;border-radius:3px} .cal-n{background:var(--sunken)} .cal i[data-today]{outline:2px solid var(--accent);outline-offset:1px} .cal-o{background:var(--accent);opacity:.55} .cal-b{background:var(--accent)} .cal-f{background:transparent;border:1px dashed var(--line)}
.chip.ok{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--accent-soft);color:var(--accent)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
select,textarea,input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.explain{max-width:68ch}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:14px}

/* the speak instrument */
.speak{display:flex;flex-direction:column;gap:10px}
.rec{width:64px;height:64px;border-radius:50%;border:3px solid var(--rec);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.rec i{width:24px;height:24px;border-radius:50%;background:var(--rec);transition:border-radius .15s,width .15s,height .15s}
.rec[aria-pressed="true"] i{width:20px;height:20px;border-radius:4px}
.rec[aria-pressed="true"]{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--bad-soft)}50%{box-shadow:0 0 0 10px var(--bad-soft)}}
.live{min-height:1.6em;font-size:16px;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px dashed var(--line)}
.live.empty{color:var(--muted);font-size:14px}
.diff{font-size:17px;line-height:1.9}
.diff .ok{color:var(--good)} .diff .miss{background:var(--bad-soft);color:var(--bad);border-radius:4px;padding:1px 4px;font-weight:600} .diff .extra{text-decoration:line-through;color:var(--muted)}
.score{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1}
.meter{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.meter div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.meter b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.1}
.target{font-size:18px;font-weight:500}
.vi{color:var(--muted);font-size:14px}
.track{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.track>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:14px 18px}
.track>summary::-webkit-details-marker{display:none}
.track .tno{font-family:var(--f-mono);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);color:var(--muted);font-size:13px;font-weight:600}
.track.isdone .tno{background:var(--good);color:var(--surface)}
.track .tbody{padding:0 18px 20px 62px}
@media (max-width:560px){.track .tbody{padding:0 14px 18px 14px}}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.cell{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px}
.cell:hover{border-color:var(--accent)} .cell[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.turn{border-left:3px solid var(--line);padding:4px 0 4px 14px}
.turn.p{border-color:var(--muted)} .turn.y{border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1.1}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:600}
.foot{margin-top:40px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:12.5px}
@media (max-width:620px){
  h1{font-size:28px}
  .top{gap:10px}
  .top>.row{width:100%;min-width:0}
  .tabs{flex-wrap:nowrap;overflow-x:auto;min-width:0;flex:1 1 100%;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;flex:none}
  .top>.row>.btn{flex:none}
  .cats.pick{display:flex;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;scrollbar-width:thin}
  .cats.pick>.cell{flex:0 0 70%;scroll-snap-align:start}
  .panel{padding:14px}
  .score{font-size:28px}
  .sayhead{flex-direction:column;flex-wrap:wrap!important}
  .sayhead>.row{align-self:flex-end}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="lamp" aria-hidden="true"></span><div><h1>Talk Shop</h1><div class="muted small">Luyện nói tiếng Anh cho công việc · hàng không & dữ liệu</div></div></div>
    <div class="row">
      <nav class="tabs" id="tabs" aria-label="Mục">
        <button class="tab" data-view="mentor">Mentor</button>
        <button class="tab" data-view="today">Hôm nay</button>
        <button class="tab" data-view="phr">Câu mẫu</button>
        <button class="tab" data-view="role">Nhập vai</button>
        <button class="tab" data-view="talk">Trình bày</button>
        <button class="tab" data-view="pron">Phát âm</button>
        <button class="tab" data-view="prog">Tiến độ</button>
      </nav>
      <button class="btn sm ghost" id="theme-btn">Sáng / Tối</button>
      <a class="btn sm ghost" href="../">Listen 30 ↗</a>
      <a class="btn sm ghost" id="cloud-badge" hidden></a>
    </div>
  </header>
  <div class="strip" id="strip" aria-label="30 ngày"></div>
  <div id="warn" class="banner" style="margin-top:14px" hidden></div>
  <div id="tour"></div>
  <main id="view" style="margin-top:18px"></main>
  <footer class="foot"><span>Ghi âm và nhận dạng chạy trong trình duyệt. Tiến độ lưu trên máy này.</span><span>Phím tắt: <b>Space</b> bắt đầu / dừng ghi âm ở nút đang hiện trên màn hình. Nên dùng Chrome hoặc Edge, đeo tai nghe có micro.</span></footer>
</div>

<script src="../meetings.js"></script>
<script src="../config.js?v=2"></script>
<script src="../sync.js?v=10"></script>
<script type="module">
import Anthropic, { AuthenticationError, PermissionDeniedError, RateLimitError, BadRequestError, NotFoundError, InternalServerError, AnthropicError, APIUserAbortError } from "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@1.3.0/+esm";
window.AIX = { Anthropic, AuthenticationError, PermissionDeniedError, RateLimitError, BadRequestError, NotFoundError, InternalServerError, AnthropicError, APIUserAbortError };
window.dispatchEvent(new Event("aix-ready"));
</script>
<script>
/* =============================== CONTENT =============================== */
const PHRASES=[
 {t:"Mở đầu họp & small talk",p:[
  ["Hi everyone, thanks for joining. Can you all hear me okay?","Chào mọi người, cảm ơn đã tham gia. Mọi người nghe rõ không?"],
  ["Let's give it a minute for others to join.","Đợi thêm một phút cho mọi người vào."],
  ["How was your weekend?","Cuối tuần thế nào?"],
  ["How's the weather in Toulouse today?","Hôm nay thời tiết ở Toulouse thế nào?"],
  ["The purpose of today's call is to agree on the scope for phase one.","Mục đích cuộc gọi hôm nay là chốt phạm vi giai đoạn một."],
  ["We have thirty minutes, so let's go through the agenda quickly.","Mình có 30 phút, nên đi nhanh qua chương trình."],
  ["Before we start, does anyone want to add anything to the agenda?","Trước khi bắt đầu, ai muốn thêm gì vào chương trình không?"]]},
 {t:"Cập nhật tiến độ",p:[
  ["Yesterday I finished the ingestion pipeline for the ACARS data.","Hôm qua tôi xong pipeline nạp dữ liệu ACARS."],
  ["Today I'm working on the reliability dashboard.","Hôm nay tôi làm dashboard reliability."],
  ["I'm blocked on access to the maintenance data.","Tôi đang vướng quyền truy cập dữ liệu bảo dưỡng."],
  ["We're on track for the release next Friday.","Chúng ta vẫn kịp release thứ Sáu tới."],
  ["We're slightly behind schedule, about two days.","Mình đang chậm một chút, khoảng hai ngày."],
  ["The main risk is the data quality from the tech logs.","Rủi ro chính là chất lượng dữ liệu từ tech log."],
  ["I'll have a first version ready for review by Wednesday.","Tôi sẽ có bản đầu để review trước thứ Tư."]]},
 {t:"Hỏi lại & làm rõ",p:[
  ["Sorry, could you repeat that last part?","Xin lỗi, nhắc lại đoạn cuối giúp tôi?"],
  ["Could you spell the part number for me, please?","Đánh vần part number giúp tôi."],
  ["Just to make sure I understand, you mean block hours, not flight hours?","Để chắc là tôi hiểu đúng: ý bạn là block hours, không phải flight hours?"],
  ["When you say daily, do you mean every calendar day?","Khi bạn nói hằng ngày, ý là mọi ngày lịch?"],
  ["Could you give me an example?","Cho tôi một ví dụ được không?"],
  ["Sorry, the line is breaking up. Could you type it in the chat?","Xin lỗi, mạng bị rè. Gõ vào chat giúp tôi?"],
  ["What would success look like for you?","Với bạn, thế nào là thành công?"]]},
 {t:"Đề xuất & thuyết phục",p:[
  ["I'd suggest we start with the A320 fleet and add the A350 later.","Tôi đề xuất bắt đầu với đội A320, thêm A350 sau."],
  ["What if we refreshed the data daily instead of weekly?","Hay là mình làm mới dữ liệu hằng ngày thay vì hằng tuần?"],
  ["One option would be to exclude no fault found removals.","Một phương án là loại các lần tháo NFF."],
  ["The main benefit is that your team saves three days every month.","Lợi ích chính là đội bạn tiết kiệm ba ngày mỗi tháng."],
  ["I think it makes sense to run a pilot first.","Tôi nghĩ nên chạy thử nghiệm trước."],
  ["Would it work for you if we delivered it in two phases?","Giao làm hai giai đoạn thì có ổn với bạn không?"],
  ["Based on the data, I'd recommend raising the alert level.","Dựa trên dữ liệu, tôi đề nghị nâng ngưỡng cảnh báo."]]},
 {t:"Không đồng ý lịch sự",p:[
  ["I see your point, but I'm not sure the data supports that.","Tôi hiểu ý bạn, nhưng chưa chắc dữ liệu ủng hộ điều đó."],
  ["That's a fair concern. However, the timeline is very tight.","Lo ngại đó hợp lý. Tuy nhiên tiến độ rất gấp."],
  ["I'd push back a little on that.","Tôi xin phản biện một chút về điểm đó."],
  ["I'm afraid that won't be possible by Friday.","E là không kịp trước thứ Sáu."],
  ["I understand the urgency, but we need the data first.","Tôi hiểu là gấp, nhưng mình cần dữ liệu trước."],
  ["Could we look at it from a different angle?","Mình nhìn vấn đề từ góc khác được không?"],
  ["I agree in principle, but I have some concerns about the scope.","Về nguyên tắc tôi đồng ý, nhưng còn lo về phạm vi."]]},
 {t:"Giải thích dữ liệu & biểu đồ",p:[
  ["As you can see on this chart, the removal rate went up sharply in September.","Như trên biểu đồ, removal rate tăng mạnh vào tháng Chín."],
  ["The x-axis shows the months, and the y-axis shows removals per thousand flight hours.","Trục hoành là tháng, trục tung là số lần tháo trên một nghìn giờ bay."],
  ["This line is the alert level, and we've been above it for three months.","Đường này là ngưỡng cảnh báo, ta đã vượt nó ba tháng."],
  ["Most of the increase comes from just two tail numbers.","Phần lớn mức tăng chỉ đến từ hai máy bay."],
  ["If we exclude no fault found, the trend is much flatter.","Nếu loại NFF, xu hướng phẳng hơn nhiều."],
  ["The numbers are roughly in line with the other operators.","Số liệu gần tương đương các hãng khác."],
  ["This is a correlation, not necessarily a cause.","Đây là tương quan, chưa chắc là nguyên nhân."]]},
 {t:"Sự cố & xin lỗi",p:[
  ["Sorry for the inconvenience, we had an issue with the pipeline last night.","Xin lỗi vì sự bất tiện, tối qua pipeline gặp sự cố."],
  ["The root cause was a change in the message format.","Nguyên nhân gốc là định dạng message bị đổi."],
  ["We've already fixed it and backfilled the missing data.","Chúng tôi đã sửa và nạp bù dữ liệu thiếu."],
  ["To prevent this from happening again, we've added an automatic check.","Để không lặp lại, chúng tôi đã thêm kiểm tra tự động."],
  ["I'll send a short incident report by the end of the day.","Cuối ngày tôi sẽ gửi báo cáo sự cố ngắn."],
  ["Thanks for your patience while we sorted it out.","Cảm ơn đã kiên nhẫn trong lúc chúng tôi xử lý."],
  ["Let me know if you still see any gaps in the data.","Nếu còn thấy thiếu dữ liệu thì báo tôi."]]},
 {t:"Chốt họp & action items",p:[
  ["Let me quickly recap the action items.","Để tôi tóm tắt nhanh các việc cần làm."],
  ["Tom will send the list of top removers by Monday.","Tom sẽ gửi danh sách thiết bị bị tháo nhiều nhất trước thứ Hai."],
  ["On my side, I'll update the dashboard and share the link.","Phía tôi sẽ cập nhật dashboard và gửi link."],
  ["Let's schedule a follow-up for next Thursday.","Hẹn họp tiếp vào thứ Năm tới."],
  ["Did I miss anything?","Tôi có bỏ sót gì không?"],
  ["Thanks everyone, that was really helpful.","Cảm ơn mọi người, buổi họp rất hữu ích."],
  ["I'll send the minutes after the call.","Sau cuộc gọi tôi sẽ gửi biên bản."]]}
];

const ROLES=[
 {t:"Daily stand-up",who:"Sarah, Scrum master",acc:"us",ctx:"Báo cáo nhanh trong buổi stand-up hằng ngày.",turns:[
  {p:"Morning! Let's do the stand-up. Nguyen, do you want to go first?"},
  {y:"Nói hôm qua bạn xong gì và hôm nay làm gì: xong pipeline ACARS, hôm nay làm dashboard reliability.",m:"Sure. Yesterday I finished the ACARS ingestion pipeline. Today I'm working on the reliability dashboard.",k:["yesterday","finished","today","dashboard"]},
  {p:"Great. Any blockers?"},
  {y:"Nói đang vướng: chưa có quyền truy cập dữ liệu bảo dưỡng của airline, nhờ Sarah giúp đẩy.",m:"Yes, one blocker. I still don't have access to the airline's maintenance data. Could you help me escalate it?",k:["blocker","access","maintenance data","escalate|help"]},
  {p:"Sure, I'll ping their IT team after this call. Anything else?"},
  {y:"Nói không còn gì, và vẫn kịp release thứ Sáu.",m:"No, that's all from me. We're still on track for Friday's release.",k:["that's all|that is all","on track","friday"]}]},
 {t:"Lấy yêu cầu với SME",who:"Tom, kỹ sư reliability",acc:"gb",ctx:"SME muốn một dashboard theo dõi độ tin cậy linh kiện.",turns:[
  {p:"So, I'd like a dashboard to track our component reliability. Where do we start?"},

const LS="talkshop.v1";
const today=()=>{ const d=new Date(); return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000); };
function blank(){ return {days:{},talks:[],phr:{},pron:{},role:{},customRoles:[],miss:{},seen:{},theme:null,voice:{},recLang:"en-US",secs:0}; }
let S=blank(); try{ const r=localStorage.getItem(LS); if(r) S=Object.assign(blank(),JSON.parse(r)); }catch(e){}
function save(){ S.updatedAt=Date.now(); try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} if(window.CloudSync) window.CloudSync.queue(); }
const TASKS=[["warm","Khởi động: câu mẫu","Nói 5 câu theo chủ đề hôm nay"],["pron","Phát âm","4 câu luyện âm khó"],["role","Nhập vai cuộc họp","Đối đáp với đồng nghiệp ảo"],["talk","Trình bày tự do","Nói liền một mạch có bấm giờ"]];
function D(n){ if(!S.days[n]) S.days[n]={t:{},c:{}}; return S.days[n]; }
function prog(n){ const d=S.days[n]; return d?TASKS.filter(([k])=>d.t[k]).length:0; }
function curDay(){ for(let n=1;n<=30;n++) if(prog(n)<TASKS.length) return n; return 30; }
function mark(n,k){ const d=D(n); if(d.t[k]) return; d.t[k]=true; save(); renderStrip(); const tr=document.getElementById("tr-"+k); if(tr){ tr.classList.add("isdone"); const c=tr.querySelector(".tstate"); c.className="chip ok tstate"; c.textContent="Xong"; } }

function loadVoices(){ if(hasTTS) voices=speechSynthesis.getVoices().filter(v=>/^(en|fr|de|es|hi)/i.test(v.lang)); }
if(hasTTS){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
const langIs=(v,l)=>v.lang.replace("_","-").toLowerCase()===l.toLowerCase();
function voiceFor(a){ if(S.voice[a]){ const v=voices.find(x=>x.name===S.voice[a]); if(v) return v; }
  let c=voices.filter(x=>langIs(x,LANG[a])); if(!c.length&&a==="in") c=voices.filter(x=>langIs(x,"hi-IN")); if(!c.length&&LANG[a].length) c=voices.filter(x=>x.lang.toLowerCase().startsWith(a)&&a!=="us"&&a!=="gb"&&a!=="in");
  return c.find(x=>GOOD.test(x.name))||c[0]||(a!=="us"?voiceFor(a==="in"?"gb":"us"):voices.find(x=>/^en/i.test(x.lang))); }
const ACRO=/\b(AOG|MRO|MEL|MSN|NFF|MTBUR|OTP|MCC|PFR|UAT|ETA|APU|ATA|SME|FH|FC|IPC|LLP|FIN|API)\b/g;
let sid=0;
function speak(text,rate=1,acc="us"){ return new Promise(res=>{ if(!hasTTS){res();return;} const id=++sid; speechSynthesis.cancel();
  setTimeout(()=>{ if(id!==sid){res();return;} const u=new SpeechSynthesisUtterance(text.replace(/\bACARS\b/g,"ay cars").replace(/\bVT-IKL\b/g,"V T, I K L").replace(ACRO,m=>m.split("").join(" "))); const v=voiceFor(acc); if(v){u.voice=v;u.lang=v.lang;} else u.lang=LANG[acc]; u.rate=rate; u.onend=u.onerror=()=>res(); speechSynthesis.speak(u); },60); }); }

/* =============================== TEXT MATCH =============================== */
const ONES="zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen".split(" ");
const TENS="  twenty thirty forty fifty sixty seventy eighty ninety".split(" ");
const w99=n=>n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?" "+ONES[n%10]:"");
const w999=n=>n<100?w99(n):ONES[Math.floor(n/100)]+" hundred"+(n%100?" "+w99(n%100):"");
function numWords(s){ const n=parseInt(s,10); if(isNaN(n)) return s; if(s.length===4&&n>=1100&&n<2000&&n%100) return w99(Math.floor(n/100))+" "+w99(n%100); if(n<1000) return w999(n); if(n<1000000) return w999(Math.floor(n/1000))+" thousand"+(n%1000?" "+w999(n%1000):""); return s; }
const SLANG={gonna:"going to",wanna:"want to",gotta:"got to",kinda:"kind of",ok:"okay",im:"i am",dont:"do not",cant:"can not",isnt:"is not",were:"were",thats:"that is",whats:"what is",ill:"i will",ive:"i have",youre:"you are",weve:"we have",theyre:"they are",lets:"let us",fifteenth:"fifteenth"};
function norm(text){
  let t=" "+text.toLowerCase().replace(/[’‘`]/g,"'")+" ";
  t=t.replace(/\ba[- ]?(\d)(\d\d)\b/g,(m,a,b)=>" a "+ONES[+a]+" "+w99(+b)+" ");
  t=t.replace(/%/g," percent").replace(/\$/g," ").replace(/&/g," and ").replace(/(\d)\.(\d)/g,"$1 point $2").replace(/(\d+):(\d+)/g," $1 $2 ").replace(/(\d),(\d)/g,"$1$2");
  t=t.replace(/(\d+)(st|nd|rd|th)\b/g,"$1");
  t=t.replace(/\bwon't\b/g,"will not").replace(/\bcan't\b/g,"can not").replace(/\bcannot\b/g,"can not").replace(/n't\b/g," not").replace(/'m\b/g," am").replace(/'re\b/g," are").replace(/'ll\b/g," will").replace(/'ve\b/g," have").replace(/'d\b/g," would").replace(/\blet's\b/g,"let us").replace(/\bthat's\b/g,"that is").replace(/\bwhat's\b/g,"what is");
  t=t.replace(/[-–—\/]/g," ").replace(/[^a-z0-9' ]/g," ").replace(/'/g,"");
  const raw=t.split(/\s+/).filter(Boolean), merged=[];
  for(let i=0;i<raw.length;i++){ if(/^[a-z]$/.test(raw[i])&&/^[a-z]$/.test(raw[i+1]||"")){ let j=i, w=""; while(/^[a-z]$/.test(raw[j]||"")){ w+=raw[j]; j++; } merged.push(w); i=j-1; } else merged.push(raw[i]); }
  const out=[]; for(const w of merged){ if(/^\d+$/.test(w)){ out.push(...numWords(w).split(" ")); continue; } const s=SLANG[w]; if(s&&s!==w) out.push(...s.split(" ")); else out.push(w); }
  return out;
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]); }
function diffWords(target,input){
  const disp=target.split(/\s+/), tn=[], owner=[]; disp.forEach((w,i)=>norm(w).forEach(x=>{tn.push(x);owner.push(i);}));
  const un=norm(input), n=tn.length, m=un.length, L=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i][j]=tn[i]===un[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const ok=new Array(n).fill(false); let i=0,j=0; while(i<n&&j<m){ if(tn[i]===un[j]){ok[i]=true;i++;j++;} else if(L[i+1][j]>=L[i][j+1]) i++; else j++; }
  const matched=ok.filter(Boolean).length;
  const miss=[], hit=[];
  const html=disp.map((w,wi)=>{ const idx=owner.map((o,k)=>o===wi?k:-1).filter(k=>k>=0); const good=idx.length===0||idx.every(k=>ok[k]); const key=w.toLowerCase().replace(/[^a-z0-9'-]/g,""); if(key.length>2) (good?hit:miss).push(key); return `<span class="${good?"ok":"miss"}">${esc(w)}</span>`; }).join(" ");
  return {html,score:Math.round(100*matched/Math.max(n,1)),miss,hit};
}
function keyHits(keys,text){ const t=" "+norm(text).join(" ")+" "; return keys.map(k=>({k:k.split("|")[0],hit:k.split("|").some(a=>t.includes(" "+norm(a).join(" ")+" "))})); }
const FILLERS=/\b(um+|uh+|erm*|ah+|hmm+|you know|i mean|basically|kind of|sort of)\b/g;

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micStream=null, active=null;
async function getMic(){ if(micStream&&micStream.active) return micStream; micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); return micStream; }
function micHelp(err){
  const inApp=/Electron|Claude/i.test(navigator.userAgent);
  if(err==="not-allowed"||err==="service-not-allowed") return "Trình duyệt đang chặn micro cho trang này. Bấm biểu tượng ổ khoá cạnh địa chỉ trang → Micro → Cho phép, rồi tải lại trang. Trên Mac, kiểm tra thêm Cài đặt hệ thống → Quyền riêng tư & Bảo mật → Micro → bật cho Chrome."+(inApp?" Trình duyệt bên trong app không dùng được micro: hãy mở trang này bằng Chrome hoặc Edge.":"");
  if(err==="busy") return "Micro đang bị ứng dụng khác dùng (Teams, Zoom, Meet…). Tắt micro hoặc thoát cuộc gọi ở ứng dụng đó rồi thử lại.";
  if(err==="audio-capture") return "Không tìm thấy micro. Cắm tai nghe có micro, hoặc chọn đúng micro trong cài đặt âm thanh của máy.";
  if(err==="network") return "Nhận dạng giọng nói của Chrome cần Internet. Kiểm tra kết nối rồi thử lại.";
  if(err==="language-not-supported") return "Trình duyệt không hỗ trợ ngôn ngữ nhận dạng đã chọn. Đổi về Tiếng Anh Mỹ trong tab Tiến độ.";
  return "Máy chưa nghe được gì. Nói to, rõ hơn, gần micro hơn, rồi bấm nút đỏ để thử lại. Nếu vẫn không được, vào tab Tiến độ → Chạy kiểm tra micro từng bước.";
}
/* step-by-step microphone self-test */
async function micTest(out){
  const row=(ok,t,d)=>{ out.insertAdjacentHTML("beforeend",`<div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:8px"><span class="chip ${ok===true?"ok":ok===false?"bad":"warn"}">${ok===true?"Đạt":ok===false?"Lỗi":"…"}</span><span class="small"><b>${esc(t)}</b>${d?"<br>"+d:""}</span></div>`); return out.lastElementChild; };
  out.innerHTML="";
  const ua=navigator.userAgent, browser=/Edg\//.test(ua)?"Edge":/Chrome\//.test(ua)&&!/Electron/.test(ua)?"Chrome":/Safari\//.test(ua)&&!/Chrome/.test(ua)?"Safari":/Electron|Claude/.test(ua)?"trình duyệt trong app":"trình duyệt khác";
  row(browser==="Chrome"||browser==="Edge",`1. Trình duyệt: ${browser}`,browser==="Chrome"||browser==="Edge"?"Hỗ trợ đầy đủ ghi âm và nhận dạng.":"Nên mở bằng Chrome hoặc Edge trên máy tính. "+(browser==="trình duyệt trong app"?"Trình duyệt bên trong app không cho dùng micro.":"Safari/iPhone có thể không cho vừa ghi âm vừa nhận dạng."));
  row(isSecureContext,"2. Trang an toàn (https)",isSecureContext?"":"Micro chỉ dùng được trên https.");
  try{ const st=(await navigator.permissions.query({name:"microphone"})).state; row(st==="granted"?true:st==="denied"?false:null,`3. Quyền micro: ${({granted:"đã cho phép",denied:"đang bị chặn",prompt:"sẽ hỏi khi dùng"})[st]||st}`,st==="denied"?micHelp("not-allowed"):""); }catch(e){ row(null,"3. Quyền micro: trình duyệt không cho biết",""); }
  let stream=null;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); const tr=stream.getAudioTracks()[0]; row(true,"4. Mở micro",esc(tr&&tr.label||"")); }
  catch(e){ row(false,"4. Mở micro",esc((e&&e.name)||"")+": "+micHelp(e&&e.name==="NotFoundError"?"audio-capture":e&&e.name==="NotReadableError"?"busy":"not-allowed")); return; }
  const lv=row(null,"5. Mức âm thanh: hãy nói “hello” trong 3 giây","");
  let peak=0; try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); const src=ac.createMediaStreamSource(stream), an=ac.createAnalyser(); an.fftSize=1024; src.connect(an); const buf=new Uint8Array(an.fftSize); const t0=Date.now();
    await new Promise(r=>{ const tick=()=>{ an.getByteTimeDomainData(buf); for(const v of buf) peak=Math.max(peak,Math.abs(v-128)); if(Date.now()-t0<3000) requestAnimationFrame(tick); else r(); }; tick(); }); ac.close(); }catch(e){}
  lv.remove(); row(peak>8,`5. Mức âm thanh: ${peak>8?"micro thu được tiếng":"gần như im lặng"}`,peak>8?"":"Micro mở nhưng không thu được tiếng: kiểm tra đúng micro trong cài đặt âm thanh của máy, hoặc micro đang bị tắt tiếng.");
  if(window.MediaRecorder){ try{ const chunks=[]; const rec=new MediaRecorder(stream); rec.ondataavailable=e=>e.data.size&&chunks.push(e.data); const pr=row(null,"6. Ghi thử 2 giây: nói gì đó",""); rec.start(); await new Promise(r=>setTimeout(r,2000)); await new Promise(r=>{ rec.onstop=r; rec.stop(); }); pr.remove();
      const url=URL.createObjectURL(new Blob(chunks,{type:chunks[0]?chunks[0].type:"audio/webm"})); const el=row(chunks.length>0,"6. Ghi âm",chunks.length?`<audio controls src="${url}" style="height:32px"></audio>`:"Không ghi được dữ liệu."); }catch(e){ row(false,"6. Ghi âm",esc(e.message||"")); } }
  else row(false,"6. Ghi âm","Trình duyệt không hỗ trợ ghi âm.");
  stream.getTracks().forEach(t=>t.stop()); micStream=null;
  if(!SR){ row(false,"7. Nhận dạng giọng nói","Trình duyệt không có. Dùng Chrome hoặc Edge."); return; }
  const sr=row(null,"7. Nhận dạng: hãy nói “testing one two three”","");
  await new Promise(res=>{ const r=new SR(); r.lang=S.recLang||"en-US"; r.interimResults=false; let got="", er=""; r.onresult=e=>{ got=e.results[0][0].transcript; }; r.onerror=e=>{ er=e.error; }; r.onend=()=>{ sr.remove(); row(!!got,"7. Nhận dạng giọng nói",got?`Máy nghe được: “${esc(got)}”`:(er?esc(er)+": "+micHelp(er):"Không nghe thấy gì. Nói to hơn hoặc gần micro hơn.")); res(); }; try{ r.start(); setTimeout(()=>{ try{ r.stop(); }catch(e){} },7000); }catch(e){ sr.remove(); row(false,"7. Nhận dạng giọng nói",esc(e.message||"")); res(); } });
  out.insertAdjacentHTML("beforeend",'<div class="small muted">Nếu bước nào báo Lỗi, làm theo hướng dẫn ở bước đó rồi chạy lại. Gửi ảnh chụp kết quả này nếu vẫn không được.</div>');
}
/* mountSpeak: one record button + live transcript + result.
   opts: target (sentence to compare), keys (keywords), continuous, maxSec, onResult(res) */
function mountSpeak(el,opts={}){
  const id="s"+Math.random().toString(36).slice(2,7);
  el.innerHTML=`<div class="speak">
   <div class="row" style="gap:14px;flex-wrap:nowrap"><button class="rec" id="${id}-rec" aria-pressed="false" aria-label="Bấm để nói"><i></i></button>
    <div style="min-width:0;flex:1"><div class="small muted"><span class="chip" style="font-size:11px">${({both:"Ghi âm + chấm",sr:"Chỉ chấm điểm",rec:"Chỉ ghi âm"})[S.recMode||"both"]}</span></div><div class="small muted" id="${id}-hint">${opts.continuous?"Bấm nút đỏ để bắt đầu, bấm lần nữa để dừng.":"Bấm nút đỏ rồi nói. Ngừng nói là máy tự dừng."}</div><div class="timer" id="${id}-t" ${opts.continuous?"":"hidden"}>0:00</div></div></div>
   <div class="live empty" id="${id}-live">Máy nghe được gì sẽ hiện ở đây</div>
   <div id="${id}-res"></div>
   <audio id="${id}-aud" controls hidden style="width:100%"></audio>
   ${opts.target?`<div class="row" id="${id}-cmp" hidden><button class="btn sm primary" id="${id}-ab">Nghe mẫu rồi nghe mình</button><span class="small muted">So nhịp, nối âm và âm cuối giữa hai bản</span></div>`:""}</div>`;
  const btn=el.querySelector("#"+id+"-rec"), live=el.querySelector("#"+id+"-live"), resEl=el.querySelector("#"+id+"-res"), aud=el.querySelector("#"+id+"-aud"), tEl=el.querySelector("#"+id+"-t");
  let run=null;
  async function start(){
    if(active&&active!==stop) active();
    if(hasTTS) speechSynthesis.cancel();
    const mode=S.recMode||"both", useSR=!!SR&&mode!=="rec";
    let stream=null, micErr=null; if(mode!=="sr"){ try{ stream=await getMic(); }catch(e){ micErr=e&&e.name||"error"; } }
    if(!stream&&!useSR){ live.classList.add("empty"); live.textContent=micHelp(micErr==="NotFoundError"?"audio-capture":micErr==="NotReadableError"?"busy":"not-allowed"); return; }
    const chunks=[]; let rec=null; if(stream){ try{ rec=new MediaRecorder(stream); rec.ondataavailable=e=>e.data.size&&chunks.push(e.data); rec.start(); }catch(e){} }
    let finalT="", interim="", stopped=false, err=null, t0=Date.now(), recog=null, timer=null;
    run={rec,chunks,t0};
    btn.setAttribute("aria-pressed","true"); live.classList.remove("empty"); live.textContent="Đang nghe…"; resEl.innerHTML="";
    let lastHeard=0, restarts=0, retriedNoRec=false;
    timer=setInterval(()=>{ const now=Date.now(), s=Math.floor((now-t0)/1000);
      if(opts.continuous){ const w=norm(finalT+" "+interim).length, live=s>=8?Math.round(w/(s/60)):0;
        tEl.innerHTML=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")+(opts.maxSec?" / "+Math.floor(opts.maxSec/60)+":"+String(opts.maxSec%60).padStart(2,"0"):"")+(live?` <span class="chip ${live>=110&&live<=165?"ok":"warn"}" style="font-size:13px">${live} từ/phút · ${live<110?"nói nhanh hơn chút":live>165?"chậm lại":"tốt"}</span>`:"");
        if(opts.maxSec&&s>=opts.maxSec) stop(); }
      else { const heard=(finalT+interim).trim(); if(heard&&now-lastHeard>1800) stop(); else if(!heard&&now-t0>10000) stop(); else if(now-t0>40000) stop(); }
    },250);
    const finish=()=>{ clearInterval(timer); btn.setAttribute("aria-pressed","false"); active=null;
      const dur=(Date.now()-t0)/1000; S.secs=(S.secs||0)+dur; if(!S.daySecs) S.daySecs={}; S.daySecs[today()]=(S.daySecs[today()]||0)+dur; save();
      let lastRes=null;
      const done=()=>{ if(chunks.length){ const blob=new Blob(chunks,{type:chunks[0].type||"audio/webm"}); aud.src=URL.createObjectURL(blob); aud.hidden=false; if(opts.onBlob) opts.onBlob(blob); const cmp=el.querySelector("#"+id+"-cmp"); if(cmp){ cmp.hidden=false; el.querySelector("#"+id+"-ab").onclick=async()=>{ aud.pause(); aud.currentTime=0; await speak(opts.target,1,opts.acc||"us"); await new Promise(r=>setTimeout(r,350)); aud.play().catch(()=>{}); }; } if(dur>1.5) recAdd({ts:Date.now(),label:opts.label||opts.target||"Bản ghi",kind:opts.kind||"phrase",text:(lastRes&&lastRes.text)||"",score:lastRes?(lastRes.score!=null?lastRes.score:(lastRes.cover!=null?lastRes.cover:null)):null,wpm:lastRes&&lastRes.wpm||0,dur:Math.round(dur),blob}); } };
      if(rec&&rec.state!=="inactive"){ rec.onstop=done; rec.stop(); } else done();
      const text=(finalT+" "+interim).trim();
      if(!text&&mode==="rec"){ live.classList.add("empty"); live.textContent=chunks.length?"Đã ghi âm (chế độ chỉ ghi âm). Nghe lại bản ghi bên dưới và so với mẫu.":"Không ghi được âm thanh. Chạy kiểm tra micro trong tab Tiến độ."; }
      else if(!text){ live.classList.add("empty");
        if(mode==="both"&&(err&&err!=="no-speech"||micErr)){ setTimeout(()=>{ live.insertAdjacentHTML("beforeend",`<div class="row" style="margin-top:8px"><button class="btn sm primary" data-swap>Thử lại ở chế độ "Chỉ chấm điểm"</button></div>`); const b=live.querySelector("[data-swap]"); if(b) b.onclick=()=>{ S.recMode="sr"; save(); live.textContent="Đã chuyển sang chế độ Chỉ chấm điểm. Bấm nút đỏ để thử lại."; }; },0); }
        live.textContent= SR? micHelp(err||(micErr?(micErr==="NotFoundError"?"audio-capture":micErr==="NotReadableError"?"busy":"not-allowed"):"no-speech")) : "Trình duyệt này không có nhận dạng giọng nói. Hãy nghe lại bản ghi của bạn và so với mẫu, hoặc mở bằng Chrome/Edge để được chấm."; }
      else live.textContent=text;
      const res={text,dur,words:norm(text).length};
      res.wpm=dur>3?Math.round(res.words/(dur/60)):0;
      res.fillers=(text.toLowerCase().match(FILLERS)||[]).length;
      if(opts.target&&text){ const d=diffWords(opts.target,text); res.score=d.score; res.html=d.html; res.miss=d.miss; if(!S.miss) S.miss={}; if(!S.seen) S.seen={}; d.miss.forEach(w=>{ S.miss[w]=(S.miss[w]||0)+1; S.seen[w]=(S.seen[w]||0)+1; }); d.hit.forEach(w=>{ S.seen[w]=(S.seen[w]||0)+1; }); save(); }
      if(opts.keys&&text){ res.hits=keyHits(opts.keys,text); res.cover=Math.round(100*res.hits.filter(h=>h.hit).length/res.hits.length); }
      lastRes=res;
      opts.onResult&&opts.onResult(res,resEl);
    };
    function stopInner(){ if(stopped) return; stopped=true; if(recog){ try{recog.stop();}catch(e){} setTimeout(finish,700); } else finish(); }
    stop=stopInner;
    active=stopInner;
    if(useSR){
      const FATAL=["not-allowed","service-not-allowed","audio-capture","network","language-not-supported"];
      const startRecog=()=>{ recog=new SR(); recog.lang=S.recLang||"en-US"; recog.interimResults=true; recog.continuous=true; recog.maxAlternatives=1;
        recog.onresult=e=>{ lastHeard=Date.now(); interim=""; for(let i=e.resultIndex;i<e.results.length;i++){ const tr=e.results[i][0].transcript; if(e.results[i].isFinal) finalT+=tr+" "; else interim+=tr; } live.textContent=(finalT+interim).trim()||"Đang nghe…"; };
        recog.onerror=e=>{ if(e.error==="audio-capture"&&stream&&!retriedNoRec){ retriedNoRec=true; try{ if(rec&&rec.state!=="inactive") rec.stop(); }catch(x){} stream.getTracks().forEach(t=>t.stop()); micStream=null; stream=null; return; } if(e.error!=="no-speech"&&e.error!=="aborted") err=e.error; };
        recog.onend=()=>{ if(!stopped&&!FATAL.includes(err)&&restarts<60){ restarts++; if(interim){ finalT+=interim+" "; interim=""; } try{ startRecog(); }catch(e){ stopped=true; finish(); } return; } if(!stopped){ stopped=true; finish(); } else finish2(); };
        try{ recog.start(); }catch(e){} };
      const finish2=()=>{};
      startRecog();
    } else if(!opts.continuous&&mode!=="rec"){ setTimeout(()=>{ if(!stopped) stopInner(); }, 8000); }
  }
  let stop=()=>{};
  btn.onclick=()=>{ btn.getAttribute("aria-pressed")==="true"?stop():start(); };
}

const VIEWS=["mentor","today","phr","role","talk","pron","prog"];
function go(v,n){ view=v; if(n) openDay=n; if(hasTTS) speechSynthesis.cancel(); if(active) active(); try{ history.replaceState(null,"",v==="today"?"#day-"+(openDay||curDay()):"#"+v); }catch(e){} render(); window.scrollTo({top:0}); }
function readHash(){ const h=location.hash.slice(1), m=h.match(/^day-(\d+)$/); if(m&&+m[1]>=1&&+m[1]<=30){ view="today"; openDay=+m[1]; } else if(VIEWS.includes(h)) view=h; }
window.addEventListener("hashchange",()=>{ readHash(); render(); });
document.getElementById("tabs").onclick=e=>{ const b=e.target.closest("[data-view]"); if(b){ if(b.dataset.view==="today") openDay=curDay(); go(b.dataset.view); } };
function renderStrip(){
  const cur=view==="today"?(openDay||curDay()):0;
  document.getElementById("strip").innerHTML=Array.from({length:30},(_,i)=>{ const n=i+1,p=prog(n); return `<button class="${p===TASKS.length?"done":p?"part":""} ${n===cur?"cur":""}" data-d="${n}" aria-label="Ngày ${n}">${n}</button>`; }).join("");
  document.querySelectorAll("#tabs .tab").forEach(b=>b.setAttribute("aria-current",b.dataset.view===view?"page":"false"));
}
document.getElementById("strip").onclick=e=>{ const b=e.target.closest("[data-d]"); if(b) go("today",+b.dataset.d); };
function render(){ renderStrip(); const el=document.getElementById("view"); ({mentor:rMentor,today:rToday,phr:rPhr,role:rRole,talk:rTalk,pron:rPron,prog:rProg})[view](el); document.querySelector('#tabs [aria-current="page"]')?.scrollIntoView({block:'nearest',inline:'nearest'}); }

/* reusable: say-after-me card list */
function sayList(el,items,{acc="us",onEach,key,keyIndex}={}){
  el.innerHTML=items.map((it,i)=>`<div class="panel stack" style="padding:14px 16px;background:var(--bg)"><div class="row sayhead" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"><div style="min-width:0"><div class="target">${esc(it[0])}</div><div class="vi">${esc(it[1])}</div></div><div class="row" style="flex-wrap:nowrap"><span class="chip mono" data-best="${i}">${key&&S[key[0]][key[1]+":"+(keyIndex!=null?keyIndex:i)]!=null?S[key[0]][key[1]+":"+(keyIndex!=null?keyIndex:i)]+"%":"–"}</span><button class="btn sm play" data-pl="${i}" aria-label="Nghe mẫu"></button><button class="btn sm play" data-sl="${i}">Chậm</button></div></div><div data-sp="${i}"></div></div>`).join("");
  el.querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>speak(items[+b.dataset.pl][0],1,acc));
  el.querySelectorAll("[data-sl]").forEach(b=>b.onclick=()=>speak(items[+b.dataset.sl][0],0.75,acc));
  el.querySelectorAll("[data-sp]").forEach(box=>{ const i=+box.dataset.sp; mountSpeak(box,{target:items[i][0],onResult:(r,resEl)=>{
    if(r.html){ resEl.innerHTML=`<div class="row" style="gap:14px;align-items:flex-start;flex-wrap:nowrap"><span class="score ${r.score>=85?"":""}" style="color:${r.score>=85?"var(--good)":r.score>=60?"var(--accent)":"var(--bad)"}">${r.score}%</span><div class="diff" style="min-width:0">${r.html}</div></div><div class="small muted">${r.score>=85?"Rõ ràng, máy hiểu gần hết.":"Chữ đỏ là chỗ máy không nhận ra: thường là âm cuối hoặc trọng âm. Bấm Chậm, nghe mẫu rồi nói lại."}</div>`;
      if(key){ const k=key[1]+":"+(keyIndex!=null?keyIndex:i); S[key[0]][k]=Math.max(S[key[0]][k]||0,r.score); save(); el.querySelector(`[data-best="${i}"]`).textContent=S[key[0]][k]+"%"; } }
    onEach&&onEach(i,r); }}); });
}

 ["The part number is D-two-three-one-eight-nine dash zero-seven, and we need it by the fourteenth.","Part number dài, nói nhanh"],

const RESCUE_KEYS=["sorry","repeat","again","spell","slow","slowly","confirm","mean","clarify","chat","type","understand","say that","what was","which","did you say"];
function rescueDrill(el){
  if(!el) return;
  el.innerHTML=`<div class="stack" style="gap:8px"><div class="small muted">Web đọc nhanh một câu khó nghe (thuật ngữ, số, giọng lạ). Nghe xong, máy tự bật micro: hãy nói một câu hỏi lại phù hợp, ví dụ "Sorry, could you spell the part number?" hay "Just to confirm, did you say six thousand two hundred?".</div><div class="row"><button class="btn sm primary" id="rq-go">Câu tiếp theo</button><span class="small muted" id="rq-n"></span></div><div id="rq-line" class="small"></div><div id="rq-sp"></div></div>`;
  let n=0, ok=0;
  el.querySelector("#rq-go").onclick=async()=>{
    const [line,why]=RESCUE_LINES[n%RESCUE_LINES.length], acc=["in","fr","de","us","gb"][n%5]; n++;
    el.querySelector("#rq-line").innerHTML=`<span class="chip">${esc(why)}</span> <span class="muted">Giọng ${ACCL[acc]}. Chữ sẽ hiện sau khi bạn trả lời.</span>`;
    const box=el.querySelector("#rq-sp");
    mountSpeak(box,{label:"Phản xạ hỏi lại",kind:"rescue",keys:RESCUE_KEYS.map(k=>k),onResult:(r,resEl)=>{
      const hit=(r.hits||[]).some(h=>h.hit); if(hit) ok++;
      el.querySelector("#rq-n").textContent=`${ok}/${n} câu hỏi lại đúng cách`;
      resEl.innerHTML=`<div class="stack" style="gap:6px"><span class="chip ${hit?"ok":"bad"}">${hit?"Tốt: bạn đã hỏi lại":"Chưa nghe thấy câu hỏi lại"}</span><div class="small"><b>Câu vừa nghe:</b> ${esc(line)}</div><div class="small muted">Gợi ý: “Sorry, could you repeat that more slowly?”, “Could you spell that for me?”, “Just to confirm, you said…?”, “What do you mean by …?”</div></div>`;
    }});
    await speak(line,1.25,acc);
    const rec=box.querySelector(".rec"); if(rec&&rec.getAttribute("aria-pressed")!=="true") rec.click();
  };
}

const STOPW=new Set("about after again their there which would could should these those where while with from that this have will your just into than then them they were what when also been being only some more most very much such each other over under".split(" "));
function replayStop(){ if(hasTTS) speechSynthesis.cancel(); }
function l30RoleFor(m,me){
  const acc=a=>ACCL[a]?a:"us"; const turns=[];
  m.lines.forEach(([w,t])=>{
    if(w===me){ const kw=[...new Set(t.toLowerCase().replace(/[^a-z' ]/g," ").split(/\s+/).filter(x=>x.length>=5&&!STOPW.has(x)))].slice(0,3);
      if(!turns.length) turns.push({p:"Over to you, "+me+".",acc:"gb"});
      if(turns[turns.length-1].y) turns.push({p:"Okay, go on.",acc:"gb"});
      turns.push({y:`Đến lượt bạn (vai ${me}). Nói ý của ${me} bằng lời của bạn. Ý chính: `+kw.join(", "),m:t,k:kw.length?kw:["okay"]}); }
    else turns.push({p:t,acc:acc(m.sp[w])});
  });
  const others=Object.keys(m.sp).filter(n=>n!==me);
  return {id:m.id+":"+me,l30:1,t:m.t,who:others.map(n=>n+" – "+ACCL[m.sp[n]]).join(", "),acc:acc(m.sp[others[0]]),ctx:m.ctx+" Bạn là "+me+".",turns};
}
/* Weakest accent from Listen 30: accent-game hits plus meeting quiz scores (same rule as Listen 30's Thống kê). */
function l30Weakest(){
  const L=readL30(), Ms=window.L30_MEETS||[]; if(!L) return null;
  const w=L.work||{}, meet=w.meet||{}, game=w.acc||{}; let best=null;
  ["gb","in","fr","de","es","au"].forEach(a=>{
    const ms=Ms.filter(m=>Object.values(m.sp).includes(a)); if(!ms.length) return;
    const sc=ms.map(m=>meet[m.id]).filter(x=>x!=null), g=game[a], parts=[];
    if(g&&g.n>=3) parts.push(100*g.ok/g.n); if(sc.length) parts.push(sc.reduce((x,y)=>x+y,0)/sc.length);
    if(!parts.length) return; const v=parts.reduce((x,y)=>x+y,0)/parts.length;
    if(!best||v<best.v) best={a,v:Math.round(v)};
  });
  return best;
}
function l30Roles(){ return (window.L30_MEETS||[]).map(m=>({m,t:m.t,who:Object.keys(m.sp).join(", "),id:m.id})); }
const lvlRate=()=>({easy:0.85,normal:1,hard:1.2})[S.roleLvl||"normal"];
function roleWidget(el,ri,onDone){
  const R=(arguments[3])||allRoles()[ri]; let step=0; const covers=[]; const takes={}; let replayTok=0;
  const ys=R.turns.filter(t=>t.y).length;
  function draw(){
    const shown=R.turns.slice(0,step+1);
    el.innerHTML=`<div class="stack"><div class="row" style="justify-content:space-between"><div><b>${esc(R.t)}</b> <span class="muted small">· ${esc(R.who)} (giọng ${ACCL[R.acc]})</span><div class="small muted">${esc(R.ctx)}</div></div><span class="row"><select id="rl-lvl" aria-label="Mức khó" style="width:auto;padding:5px 8px">${[["easy","Dễ: chậm, hiện chữ"],["normal","Vừa"],["hard","Khó: nhanh, ẩn gợi ý"]].map(([v,t])=>`<option value="${v}" ${(S.roleLvl||"normal")===v?"selected":""}>${t}</option>`).join("")}</select><button class="btn sm ghost" id="rl-restart">Làm lại</button></span></div>
     <div class="stack" style="gap:10px">${shown.map((t,i)=>t.p?`<div class="turn p"><div class="label">${esc(R.who.split(",")[0])}</div><div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:8px"><button class="btn sm play" data-pp="${i}" aria-label="Nghe"></button><span class="${i===step?"":"muted"}" data-txt="${i}">${i===step?'<span class="muted small">(Nghe trước, bấm "Hiện chữ" nếu cần)</span> <button class="btn sm ghost" data-show="'+i+'">Hiện chữ</button>':esc(t.p)}</span></div></div>`
       :`<div class="turn y"><div class="label">Bạn</div>${(S.roleLvl==="hard"&&i===step)?`<button class="btn sm ghost" data-hint>Xem gợi ý (mức khó: tự nghĩ trước)</button><div class="vi" style="color:var(--ink)" hidden>${esc(t.y)}</div>`:`<div class="vi" style="color:var(--ink)">${esc(t.y)}</div>`}${i<step?`<div class="small muted" style="margin-top:4px">Mẫu: ${esc(t.m)}</div>`:`<div id="rl-sp" style="margin-top:8px"></div>`}</div>`).join("")}</div>
     ${step>=R.turns.length?`<div class="banner" style="background:var(--good-soft);border-color:var(--good)">Xong cuộc hội thoại. Trung bình ${Math.round(covers.reduce((a,b)=>a+b,0)/Math.max(1,covers.length))}% ý chính. Làm lại lần hai và cố nói không cần nhìn gợi ý. <div class="row" style="margin-top:8px"><button class="btn sm primary" id="rl-replay">Nghe lại cả cuộc hội thoại có giọng bạn</button><button class="btn sm ghost" id="rl-stop">Dừng</button></div></div>`:""}</div>`;
    el.querySelector("#rl-restart").onclick=()=>{ replayTok++; step=0; covers.length=0; for(const k in takes) delete takes[k]; draw(); };
    const rp=el.querySelector("#rl-replay"); if(rp) rp.onclick=async()=>{ const tok=++replayTok;
      for(let i=0;i<R.turns.length;i++){ if(tok!==replayTok) return; const t=R.turns[i];
        if(t.p) await speak(t.p,1,R.acc);
        else if(takes[i]) await new Promise(res=>{ const a=new Audio(URL.createObjectURL(takes[i])); a.onended=a.onerror=()=>res(); a.play().catch(()=>res()); el._replayAudio=a; });
        else await speak(t.m,1,"us");
        await new Promise(r=>setTimeout(r,300)); } };
    const st=el.querySelector("#rl-stop"); if(st) st.onclick=()=>{ replayTok++; if(hasTTS) speechSynthesis.cancel(); if(el._replayAudio) el._replayAudio.pause(); };
    el.querySelector("#rl-lvl").onchange=e=>{ S.roleLvl=e.target.value; save(); replayTok++; if(hasTTS) speechSynthesis.cancel(); step=0; covers.length=0; draw(); };
    el.querySelectorAll("[data-hint]").forEach(b=>b.onclick=()=>{ b.nextElementSibling.hidden=false; b.remove(); });
    el.querySelectorAll("[data-pp]").forEach(b=>b.onclick=()=>speak(R.turns[+b.dataset.pp].p,lvlRate(),R.acc));
    el.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.show; el.querySelector(`[data-txt="${i}"]`).textContent=R.turns[i].p; });
    if(S.roleLvl==="easy") el.querySelectorAll("[data-show]").forEach(x=>x.click());
    const cur=R.turns[step];
    if(cur&&cur.p){ speak(cur.p,lvlRate(),cur.acc||R.acc).then(()=>{ if(!document.body.contains(el)) return; if(R.turns[step]===cur){ step++; if(step<R.turns.length) draw(); else finish(); } }); }
    if(cur&&cur.y){ const box=el.querySelector("#rl-sp"); mountSpeak(box,{onBlob:b=>{ takes[step]=b; },label:R.t+" · lượt "+(Math.floor(step/2)+1),kind:"role",keys:cur.k,onResult:(r,resEl)=>{
      const hits=r.hits||cur.k.map(k=>({k:k.split("|")[0],hit:false})), cover=r.cover||0;
      resEl.innerHTML=`<div class="stack" style="gap:8px"><div class="row"><span class="label">Ý chính</span>${hits.map(h=>`<span class="chip ${h.hit?"ok":"bad"}">${h.hit?"✓":"✗"} ${esc(h.k)}</span>`).join("")}</div>
        <div class="row"><span class="small muted">Câu mẫu:</span> <span>${esc(cur.m)}</span></div>
        <div class="row"><button class="btn sm play" id="rl-model">Nghe mẫu</button><button class="btn sm" id="rl-again">Nói lại</button><button class="btn sm primary" id="rl-next">Tiếp →</button></div></div>`;
      if(r.text) aiFeedback(resEl.firstElementChild,rolePrompt(R,cur,(R.turns[step-1]||{}).p||"",r),"Mentor AI góp ý");
      resEl.querySelector("#rl-model").onclick=()=>speak(cur.m,1,"us");
      resEl.querySelector("#rl-again").onclick=()=>draw();
      resEl.querySelector("#rl-next").onclick=()=>{ covers.push(cover); step++; if(step>=R.turns.length) finish(); else draw(); };
    }}); }
  }
  function finish(){ const avg=Math.round(covers.reduce((a,b)=>a+b,0)/Math.max(1,covers.length)); if(R.l30){ if(!S.l30role) S.l30role={}; S.l30role[R.id]=Math.max(S.l30role[R.id]||0,avg); } else if(R.custom) R.best=Math.max(R.best||0,avg); else S.role[ri]=Math.max(S.role[ri]||0,avg); save(); step=R.turns.length; draw(); onDone&&onDone(avg); }
  draw();
}

function hardWords(){
  const m=S.miss||{}, sn=S.seen||{};
  return Object.keys(m).filter(w=>m[w]>=2).map(w=>({w,miss:m[w],seen:sn[w]||m[w],rate:m[w]/(sn[w]||m[w])})).sort((a,b)=>b.rate-a.rate||b.miss-a.miss).slice(0,15);
}
function sentencesWith(w){
  const pool=[...PHRASES.flatMap(c=>c.p.map(x=>x[0])),...PRON.flatMap(g=>g.items.map(x=>x[0])),...ROLES.flatMap(r=>r.turns.filter(t=>t.m).map(t=>t.m)),...TALKS.map(t=>t.m).flatMap(m=>m.split(/(?<=[.!?])\s+/))];
  const re=new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i");
  return [...new Set(pool.filter(x=>re.test(x)))].sort((a,b)=>a.length-b.length).slice(0,3);
}

  if(L) Object.values(L.days||{}).forEach(d=>{ if(d.doneAt){ const x=new Date(d.doneAt); l30.add(Math.floor((x.getTime()-x.getTimezoneOffset()*60000)/86400000)); } });
  const dow=d=>(new Date(d*86400000).getUTCDay()+6)%7, start=t-dow(t)-28, cells=[]; let active=0, streak=0;
  for(let d=start; d<=t+(6-dow(t)); d++){

  { const ni=PRON.findIndex(g=>g.t==="Nói số liệu"), nv=pronAvg[ni]; if(ni>=0&&(nv==null||nv<85)&&(sk.includes("aog")||sk.includes("sme")||sk.includes("demo"))) acts.push({p:62,m:4,t:"Nói số liệu như khi báo cáo",why:nv==null?"Báo cáo trong họp luôn có số: giá, phần trăm, giờ bay, ngày.":`Độ rõ khi nói số mới ${nv}%.`,go:()=>{ sel.pron=ni; go("pron"); }}); }

function aiErrorText(e){
  const X=window.AIX||{};
  if(X.APIUserAbortError&&e instanceof X.APIUserAbortError) return "Đã dừng.";
  if(X.AuthenticationError&&e instanceof X.AuthenticationError) return "API key không đúng hoặc đã bị thu hồi. Kiểm tra lại key trong mục Mentor AI.";
  if(X.PermissionDeniedError&&e instanceof X.PermissionDeniedError) return "Key này không có quyền dùng model đã chọn. Thử model khác trong Cài đặt AI.";
  if(X.NotFoundError&&e instanceof X.NotFoundError) return "Không tìm thấy model. Chọn model khác trong Cài đặt AI.";
  if(X.RateLimitError&&e instanceof X.RateLimitError) return "Đang vượt giới hạn gọi API hoặc hết hạn mức. Đợi một chút rồi thử lại, hoặc kiểm tra số dư tài khoản Anthropic.";
  if(X.BadRequestError&&e instanceof X.BadRequestError) return "Yêu cầu bị từ chối: "+(e.message||"");
  if(X.InternalServerError&&e instanceof X.InternalServerError) return "Máy chủ Anthropic đang lỗi. Thử lại sau ít phút.";
  if(X.AnthropicError&&e instanceof X.AnthropicError) return "Không kết nối được tới Anthropic: "+(e.message||"");

function mdRender(s){
  const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,'<code class="mono">$1</code>');
  const out=[]; let list=null;
  const close=()=>{ if(list){ out.push(`</${list}>`); list=null; } };
  s.split("\n").forEach(line=>{
    const t=line.trimEnd();
    if(/^>\s?/.test(t)){ close(); const en=t.replace(/^>\s?/,""); out.push(`<div class="row" style="flex-wrap:nowrap;gap:8px;align-items:flex-start;margin:4px 0"><button class="btn sm play" data-say="${esc(en)}" aria-label="Nghe câu này"></button><span style="font-weight:500">${inline(en)}</span></div>`); return; }
    if(/^#{1,4}\s/.test(t)){ close(); out.push(`<div style="font-weight:700;margin-top:10px">${inline(t.replace(/^#+\s/,""))}</div>`); return; }
    const ul=t.match(/^\s*[-*•]\s+(.*)/), ol=t.match(/^\s*\d+[.)]\s+(.*)/);
    if(ul||ol){ const k=ul?"ul":"ol"; if(list!==k){ close(); out.push(`<${k} style="margin:4px 0;padding-left:20px">`); list=k; } out.push(`<li>${inline((ul||ol)[1])}</li>`); return; }
    close(); if(t.trim()) out.push(`<p style="margin:6px 0">${inline(t)}</p>`);
  });
  close(); return out.join("");
}

/* =============================== RECORDING HISTORY (IndexedDB) =============================== */
const RECDB={p:null,open(){ return this.p||(this.p=new Promise((res,rej)=>{ const r=indexedDB.open("talkshop",1); r.onupgradeneeded=()=>r.result.createObjectStore("recs",{keyPath:"id",autoIncrement:true}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); }};
async function recTx(mode,fn){ const db=await RECDB.open(); return new Promise((res,rej)=>{ const t=db.transaction("recs",mode); const out=fn(t.objectStore("recs")); t.oncomplete=()=>res(out&&"result" in out?out.result:undefined); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
async function recAll(){ try{ return (await recTx("readonly",st=>st.getAll()))||[]; }catch(e){ return []; } }
async function recAdd(r){ try{ await recTx("readwrite",st=>st.add(r)); const all=await recAll(); if(all.length>60){ const old=all.slice(0,all.length-60); await recTx("readwrite",st=>{ old.forEach(x=>st.delete(x.id)); }); } }catch(e){} }
async function recClear(){ try{ await recTx("readwrite",st=>st.clear()); }catch(e){} }

let recConfirm=false;
let recDay=null; const tsDay=t=>{ const x=new Date(t); return Math.floor((x.getTime()-x.getTimezoneOffset()*60000)/86400000); };
async function drawRecs(el){
  const box=el.querySelector("#rec-list"); if(!box) return;

    const day=all.filter(r=>tsDay(r.ts)===recDay), lab=new Date(recDay*86400000).toISOString().slice(5,10).split("-").reverse().join("/");

    box.querySelector("#rec-all").onclick=()=>{ recDay=null; drawRecs(el); };
    let cur=null; box.querySelectorAll("[data-rec]").forEach(b=>b.onclick=()=>{ const r=day.find(x=>x.id===+b.dataset.rec); if(!r) return; if(cur) cur.pause(); cur=new Audio(URL.createObjectURL(r.blob)); cur.play().catch(()=>{}); });
    return;
  }
  const clr=el.querySelector("#rec-clear");
  clr.onclick=()=>{ recConfirm=true; drawRecs(el); };
  if(!all.length){ box.innerHTML='<span class="small muted">Chưa có bản ghi nào. Các bài nói của bạn sẽ được lưu ở đây.</span>'; return; }
  const groups={}; all.forEach(r=>{ (groups[r.label]=groups[r.label]||[]).push(r); });
  const fmt=t=>new Date(t).toLocaleDateString("vi-VN",{day:"numeric",month:"numeric"})+" "+new Date(t).toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});
  const row=(r,tag)=>`<div class="row" style="flex-wrap:nowrap;gap:8px;align-items:flex-start"><button class="btn sm play" data-rec="${r.id}" aria-label="Nghe bản ghi"></button><div style="min-width:0"><span class="small muted">${tag?tag+" · ":""}${fmt(r.ts)} · ${r.dur}s${r.score!=null?" · "+r.score+"%":""}${r.wpm?" · "+r.wpm+" từ/phút":""}</span><div class="small">${esc(r.text||"(không nhận dạng được)")}</div></div></div>`;
  const labels=Object.keys(groups).sort((a,b)=>groups[b][groups[b].length-1].ts-groups[a][groups[a].length-1].ts);
  box.innerHTML=(recConfirm?`<div class="banner row" style="justify-content:space-between;margin-bottom:8px"><span>Xoá toàn bộ ${all.length} bản ghi trên máy này? Không hoàn tác được.</span><span class="row"><button class="btn sm" id="rec-yes" style="border-color:var(--bad);color:var(--bad)">Xoá</button><button class="btn sm ghost" id="rec-no">Huỷ</button></span></div>`:"")+
    `<div class="stack" style="gap:12px">${labels.slice(0,15).map(l=>{ const g=groups[l]; return `<div class="stack" style="gap:6px;border-top:1px solid var(--line);padding-top:10px"><b class="small">${esc(l)}</b>${g.length>1?row(g[0],"Lần đầu")+row(g[g.length-1],"Mới nhất"):row(g[0],"")}</div>`; }).join("")}</div>`;
  const urls={}; let cur=null;
  box.querySelectorAll("[data-rec]").forEach(b=>b.onclick=()=>{ const r=all.find(x=>x.id===+b.dataset.rec); if(!r) return; if(cur){ cur.pause(); } urls[r.id]=urls[r.id]||URL.createObjectURL(r.blob); cur=new Audio(urls[r.id]); cur.play().catch(()=>{}); });
  const y=box.querySelector("#rec-yes"); if(y) y.onclick=async()=>{ recConfirm=false; await recClear(); drawRecs(el); };
  const n=box.querySelector("#rec-no"); if(n) n.onclick=()=>{ recConfirm=false; drawRecs(el); };
}

/* Space starts/stops the record button that is on screen */
document.addEventListener("keydown",e=>{
  if(e.code!=="Space"||e.repeat||e.metaKey||e.ctrlKey||e.altKey) return;
  const tag=(e.target.tagName||"").toLowerCase(); if(["input","textarea","select","button","a","summary","label"].includes(tag)||e.target.isContentEditable) return;
  const recs=[...document.querySelectorAll(".rec")];
  let b=recs.find(x=>x.getAttribute("aria-pressed")==="true");
  if(!b){ const h=window.innerHeight; b=recs.find(x=>{ const r=x.getBoundingClientRect(); return r.width>0&&r.top>=0&&r.bottom<=h; }); }
  if(!b) return; e.preventDefault(); b.click(); b.focus({preventScroll:true});
});

/* =============================== FIRST-VISIT TOUR =============================== */
const TOUR_STEPS=[["Bắt đầu ở tab Mentor","Trả lời 6 câu hỏi để Mentor biết bạn họp với ai và khó khăn ở đâu. Mỗi ngày Mentor xếp danh sách việc vừa với số phút bạn có, dựa trên kết quả luyện tập thật.","mentor"],["Bấm nút đỏ (hoặc phím Space) rồi nói","Máy nghe và tô đỏ từ chưa rõ. Mọi bản ghi được lưu để bạn so lần đầu với lần mới nhất. Dùng Chrome hoặc Edge, đeo tai nghe.","pron"],["Bật Mentor AI để được sửa bài chi tiết","Dán API key Anthropic trong tab Mentor: Claude chấm bài trình bày, góp ý nhập vai, tạo kịch bản từ cuộc họp thật và soạn tin nhắn Teams.",""]];
function renderTour(i){
  const el=document.getElementById("tour"); if(!el) return;
  if(i===0&&!S.tourDone&&(S.profile||S.talks.length>0)){ S.tourDone=1; save(); }
  if(S.tourDone||i>=TOUR_STEPS.length){ el.innerHTML=""; if(!S.tourDone){ S.tourDone=1; save(); } return; }
  const [t,d,v]=TOUR_STEPS[i];
  el.innerHTML=`<div class="panel stack" role="dialog" aria-label="Hướng dẫn nhanh" style="gap:8px;margin-top:14px;border-color:var(--accent)"><div class="row" style="justify-content:space-between"><span class="label">Hướng dẫn nhanh · ${i+1}/${TOUR_STEPS.length}</span><button class="btn sm ghost" id="tour-skip">Bỏ qua</button></div><b>${t}</b><div class="small explain">${d}</div><div class="row">${v?`<button class="btn sm" id="tour-show">Xem ngay</button>`:""}<button class="btn sm primary" id="tour-next">${i+1<TOUR_STEPS.length?"Tiếp":"Bắt đầu học"}</button></div></div>`;
  el.querySelector("#tour-skip").onclick=()=>{ S.tourDone=1; save(); el.innerHTML=""; };
  el.querySelector("#tour-next").onclick=()=>renderTour(i+1);
  const sh=el.querySelector("#tour-show"); if(sh) sh.onclick=()=>{ go(v); renderTour(i); };
}

/* =============================== THEME & BOOT =============================== */
function applyTheme(){ if(S.theme) document.documentElement.setAttribute("data-theme",S.theme); }
if(window.CloudSync) window.CloudSync.badge(document.getElementById("cloud-badge"),"#prog","chip");
document.getElementById("theme-btn").onclick=()=>{ const dark=S.theme?S.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches; S.theme=dark?"light":"dark"; save(); applyTheme(); };
applyTheme();
const warn=[]; if(!SR) warn.push("Trình duyệt này không có nhận dạng giọng nói, nên chỉ ghi âm được mà không chấm được. Hãy mở bằng Chrome hoặc Edge.");
if(!navigator.mediaDevices||!window.MediaRecorder) warn.push("Trình duyệt không hỗ trợ ghi âm.");
if(warn.length){ const w=document.getElementById("warn"); w.textContent=warn.join(" "); w.hidden=false; }
if("serviceWorker" in navigator && /github\.io$/.test(location.hostname)){ navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(()=>{}); }
function netNote(){ const w=document.getElementById("warn"); if(!w) return; if(!navigator.onLine){ w.textContent="Bạn đang ngoại tuyến. Nghe mẫu và ghi âm vẫn dùng được; chấm điểm bằng nhận dạng giọng nói và Mentor AI cần Internet."; w.hidden=false; } }
window.addEventListener("offline",netNote); window.addEventListener("online",()=>location.reload()); netNote();
readHash(); if(view==="today"&&!openDay) openDay=curDay(); render(); renderTour(0);
